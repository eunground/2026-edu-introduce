<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>2분기 활동</title>
    <!--외부 스타일 시트 연결하기 (season.css 파일)-->
    <link rel="stylesheet" href="../css/season.css">
    <style>
        section div img {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <a href="./index.html">← 내 페이지로</a>
        <h1>2분기 활동</h1>
        <p>2분기에 진행한 활동 사진을 모아봤어요.</p>  <!--내용 자유롭게 바꿔도 됩니다-->
    </header>

    <main>
        <section>
            <div>
                <img src="../images/20260804_142136.jpg" alt="활동 사진 1" class="gallery-img"> <!--alt는 사진 설명 (화면에는 안 보임)-->
                <p>무더운 여름날 친구들과 워터파크</p> <!--사진 한 줄 설명-->
            </div>

            <div>
                <img src="../images/img_8510.jpeg" alt="활동 사진 2" class="gallery-img">
                <p>백룸을 보러 갔는데 내 휴대폰과 같이 백룸에 가버렸다 ㅠㅠ</p>
            </div>

            <div>
                <img src="../images/20260630_184803.jpg" alt="활동 사진 3" class="gallery-img">
                <p>2루까지 질주중인 선수</p>
            </div>

            <div>
                <img src="../images/img_3065.jpeg" alt="활동 사진 4" class="gallery-img">
                <p>입학</p>
            </div>    

            <div>
                <img src="../images/20261030_180018.jpg" alt="활동 사진 5" class="gallery-img">
                <p>수업열중</p>
            </div>    
        </section>
    </main>

    <footer>
        <a href="../../통합/html/home.html">반 전체 페이지로</a>
    </footer>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('fullImage');
        const closeBtn = document.getElementsByClassName("close")[0];
        
        const images = document.querySelectorAll('.gallery-img');

        images.forEach(img => {
            img.addEventListener('click', function() {
                modal.style.display = "flex";
                modalImg.src = this.src;
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>

</html>
