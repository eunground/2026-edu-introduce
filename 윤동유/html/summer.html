<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>2분기 활동</title>
    <!--외부 스타일 시트 연결하기 (season.css 파일)-->
    <link rel="stylesheet" href="../css/season.css">
    <style>
        section div img {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <a href="./index.html">← 내 페이지로</a>
        <h1>2분기 활동</h1>
        <p>2분기에 진행한 활동 사진을 모아봤어요.</p>  <!--내용 자유롭게 바꿔도 됩니다-->
    </header>

    <main>
        <section>
            <div>
                <img src="../images/여름1.png" alt="활동 사진 1" class="gallery-img"> <!--alt는 사진 설명 (화면에는 안 보임)-->
                <p>멋진남자</p> <!--사진 한 줄 설명-->
            </div>

            <div>
                <img src="../images/여름2.png" alt="활동 사진 2" class="gallery-img">
                <p>댄스킹</p>
            </div>

            <div>
                <img src="../images/여름3.png" alt="활동 사진 3" class="gallery-img">
                <p>넘어지기 1초전</p>
            </div>

            <div>
                <img src="../images/여름4.png" alt="활동 사진 3" class="gallery-img">
                <p>심심한 남자2명</p>
            </div>

            <div>
                <img src="../images/여름5.png" alt="활동 사진 3" class="gallery-img">
                <p>스껄</p>
            </div>

            <div>
                <img src="../images/여름6.png" alt="활동 사진 3" class="gallery-img">
                <p>무서운 남자</p>
            </div>

            <div>
                <img src="../images/여름7.png" alt="활동 사진 3" class="gallery-img">
                <p>무서운 남자2</p>
            </div>

            <div>
                <img src="../images/여름8.png" alt="활동 사진 3" class="gallery-img">
                <p>즐거운 남자</p>
            </div>

            <div>
                <img src="../images/여름9.png" alt="활동 사진 3" class="gallery-img">
                <p>로멘틱스러운 남자들</p>
            </div>

            <div>
                <img src="../images/여름10.png" alt="활동 사진 3" class="gallery-img">
                <p>서로 사랑하는 남자</p>
            </div>

            <div>
                <img src="../images/여름11.png" alt="활동 사진 3" class="gallery-img">
                <p>중2병 걸린 남자</p>
            </div>

            <div>
                <img src="../images/여름12.png" alt="활동 사진 3" class="gallery-img">
                <p>폭력적인 남자</p>
            </div>

            <div>
                <img src="../images/여름13.png" alt="활동 사진 3" class="gallery-img">
                <p>팔이 아파 즐거운 남자</p>
            </div>

            <div>
                <img src="../images/여름14.png" alt="활동 사진 3" class="gallery-img">
                <p>집중하는 남자</p>
            </div>

            <div>
                <img src="../images/여름15.png" alt="활동 사진 3" class="gallery-img">
                <p>집중하는 남자의 속마음</p>
            </div>

        </section>
    </main>

    <footer>
        <a href="../../통합/html/home.html">반 전체 페이지로</a>
    </footer>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('fullImage');
        const closeBtn = document.getElementsByClassName("close")[0];
        
        const images = document.querySelectorAll('.gallery-img');

        images.forEach(img => {
            img.addEventListener('click', function() {
                modal.style.display = "flex";
                modalImg.src = this.src;
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>

</html>
