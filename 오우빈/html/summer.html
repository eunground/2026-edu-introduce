<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>2분기 활동</title>
    <!--외부 스타일 시트 연결하기 (season.css 파일)-->
    <link rel="stylesheet" href="../css/season.css">
    <style>
        section div img {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <a href="./index.html">← 내 페이지로</a>
        <h1>2분기 활동</h1>
        <p>2분기에 진행한 활동 사진을 모아봤어요.</p>  <!--내용 자유롭게 바꿔도 됩니다-->
    </header>

    <main>
        <section>
            <div>
                <img src="../images/여름1.jpeg" alt="활동 사진 1" class="gallery-img"> <!--alt는 사진 설명 (화면에는 안 보임)-->
                <p>애버랜드! 또 가고싶다</p> <!--사진 한 줄 설명-->
            </div>

            <div>
                <img src="../images/여름2.jpeg" alt="활동 사진 2" class="gallery-img">
                <p>귀여운 리트리버</p>
            </div>

            <div>
                <img src="../images/여름7.jpg" alt="활동 사진 3" class="gallery-img">
                <p>귀여운 리트리버의 귀여운 아기들</p>
            </div>
            <div>
                <img src="../images/여름4.jpg" alt="활동 사진 3" class="gallery-img">
                <p>힘들지만 재밌었던 물놀이</p>
            </div>
            <div>
                <img src="../images/여름5.jpg" alt="활동 사진 3" class="gallery-img">
                <p>설이와 함께 축제</p>
            </div>
            <div>
                <img src="../images/여름6.jpg" alt="활동 사진 3" class="gallery-img">
                <p>실감나는 카트라이더</p>
            </div>
            <div>
                <img src="../images/여름3.jpeg" alt="활동 사진 3" class="gallery-img">
                <p>민속촌 단체사진</p>
            </div>
            <div>
                <img src="../images/여름8.jpg" alt="활동 사진 3" class="gallery-img">
                <p>힘들었던 트랙킹...</p>
            </div>
            <div>
                <img src="../images/여름9.jpg" alt="활동 사진 3" class="gallery-img">
                <p>입학식에서 상받았다</p>
            </div><div>
                <img src="../images/여름10.jpeg" alt="활동 사진 3" class="gallery-img">
                <p>발표랑 준비 다 내가 했다</p>
            </div>
        </section>
    </main>

    <footer>
        <a href="../../통합/html/home.html">반 전체 페이지로</a>
    </footer>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('fullImage');
        const closeBtn = document.getElementsByClassName("close")[0];
        
        const images = document.querySelectorAll('.gallery-img');

        images.forEach(img => {
            img.addEventListener('click', function() {
                modal.style.display = "flex";
                modalImg.src = this.src;
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>

</html>
