<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>1 분기</title>
    <!--외부 스타일 시트 연결하기 (season.css 파일)-->
    <link rel = "stylesheet" href="../css/season.css">
    <style>
        section div img {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <a href="./index.html">← 내 페이지로</a>
        <h1>4분기</h1>
        <p>겨울에 진행한 활동 사진을 모아봤어요.</p>  <!--내용 자유롭게 바꿔도 됩니다-->
    </header>

    <main>
        <section>
            <div>
                <img src="../images/겨울2.jpeg" alt="활동 사진 1" class="gallery-img"> <!--alt는 사진 설명 (화면에는 안 보임)-->
                <p>고트 goat god 뉴진스랑 결혼하고 강해린이랑 결혼
                
                </p> <!--사진 한 줄 설명-->
            </div>

            <div>
                <img src="../images/겨울4.jpeg" alt="활동 사진 2" class="gallery-img">
                <p>배경이 더 강조되는 작품</p>
            </div>

            <div>
                <img src="../images/겨울3.jpeg" alt="활동 사진 3" class="gallery-img">
                <p>왜사진이 안보여 어 다시보이네</p>
            </div>

            <div>
                <img src="../images/겨울4.jpeg" alt="활동 사진 3" class="gallery-img">
                <p>왜사진이 안보여</p>
            </div>
        </section>
    </main>

    <footer>
        <a href="../../통합/html/home.html">반 전체 페이지로</a>
    </footer>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('fullImage');
        const closeBtn = document.getElementsByClassName("close")[0];
        
        const images = document.querySelectorAll('.gallery-img');

        images.forEach(img => {
            img.addEventListener('click', function() {
                modal.style.display = "flex";
                modalImg.src = this.src;
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>

</html>
