<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>2분기 활동</title>
    <!--외부 스타일 시트 연결하기 (season.css 파일)-->
    <link rel="stylesheet" href="../css/season.css">
    <style>
        section div img {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <a href="./index.html">← 내 페이지로</a>
        <h1>2분기 활동</h1>
        <p>2분기에 진행한 활동 사진을 모아봤어요.</p>  <!--내용 자유롭게 바꿔도 됩니다-->
    </header>

    <main>
        <section>
            <div>
                <img src="../images/여름1.jpg" alt="활동 사진 2" class="gallery-img">
                <p>야! 저기 카리나 지나간다.</p>
            </div>

            <div>
                <img src="../images/여름2.jpg" alt="활동 사진 2" class="gallery-img">
                <p>물먹은 하마들 브이~</p>
            </div>

            <div>
                <img src="../images/여름3.jpg" alt="활동 사진 3" class="gallery-img">
                <p>집가자</p>
            </div>

            <div>
                <img src="../images/여름4.jpeg" alt="활동 사진 3" class="gallery-img">
                <p>ㄹㅈㄷ매치                 
                </p>
            </div>
        </section>
    </main>

    <footer>
        <a href="../../통합/html/home.html">반 전체 페이지로</a>
    </footer>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('fullImage');
        const closeBtn = document.getElementsByClassName("close")[0];
        
        const images = document.querySelectorAll('.gallery-img');

        images.forEach(img => {
            img.addEventListener('click', function() {
                modal.style.display = "flex";
                modalImg.src = this.src;
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        modal.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>

</html>
